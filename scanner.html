<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f1f5f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 1.3rem; margin: 0 0 16px 0; text-align: center; }
    #reader { width: 100%; max-width: 380px; border-radius: 16px; overflow: hidden; border: 2px solid #334155; }
    #result { margin-top: 20px; width: 100%; max-width: 380px; min-height: 70px; border-radius: 12px; padding: 16px; text-align: center; font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; justify-content: center; background: #1e293b; color: #94a3b8; }
    #result.in { background: #14532d; color: #bbf7d0; }
    #result.out { background: #1e3a8a; color: #bfdbfe; }
    #result.error { background: #7f1d1d; color: #fecaca; }
    #status { margin-top: 10px; font-size: 0.8rem; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <h1>📷 Scan Your QR Code</h1>
  <div id="reader"></div>
  <div id="result">Point your camera at a QR code</div>
  <div id="status"></div>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPjw95HouwwcwBeJc4J_ZZA0Pqcm9DqcYasKwIbvP2TNS7n-t4dDZQHze-st_Z5nUl/exec";
    let isProcessing = false;
    function jsonpRequest(id, onSuccess, onError) {
      const callbackName = "jsonpCallback_" + Date.now();
      const script = document.createElement("script");
      const cleanup = function () { delete window[callbackName]; if (script.parentNode) script.parentNode.removeChild(script); };
      window[callbackName] = function (data) { cleanup(); onSuccess(data); };
      script.onerror = function () { cleanup(); onError(new Error("Could not reach the server.")); };
      script.src = WEB_APP_URL + "?id=" + encodeURIComponent(id) + "&callback=" + callbackName;
      document.body.appendChild(script);
    }
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      const resultDiv = document.getElementById("result");
      resultDiv.className = "";
      resultDiv.textContent = "Recording scan...";
      jsonpRequest(decodedText,
        function (data) {
          resultDiv.className = data.status === "in" ? "in" : (data.status === "out" ? "out" : "error");
          resultDiv.textContent = data.message;
          setTimeout(function () { isProcessing = false; }, 3000);
        },
        function (err) {
          resultDiv.className = "error";
          resultDiv.textContent = "Error: " + err.message;
          setTimeout(function () { isProcessing = false; }, 3000);
        }
      );
    }
    function onScanFailure() {}
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScanSuccess, onScanFailure)
      .catch(function (err) { document.getElementById("status").textContent = "Camera error: " + err; });
  </script>
</body>
</html>
