<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BCI Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { font-size: 1.3rem; margin: 0 0 16px 0; text-align: center; }
    #search {
      width: 100%;
      max-width: 420px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    #search:focus { outline: none; border-color: #38bdf8; }
    #list {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 55vh;
      overflow-y: auto;
    }
    .person-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .person-btn:active { background: #334155; }
    .person-btn .purpose { display: block; font-size: 0.8rem; font-weight: 400; color: #94a3b8; margin-top: 2px; }
    #result {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
      min-height: 60px;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #result.show { display: flex; }
    #result.in { background: #14532d; color: #bbf7d0; }
    #result.out { background: #1e3a8a; color: #bfdbfe; }
    #result.error { background: #7f1d1d; color: #fecaca; }
    #status { margin-top: 10px; font-size: 0.85rem; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <h1>👋 Tap your name to check in / out</h1>
  <input type="text" id="search" placeholder="Search your name...">
  <div id="list"></div>
  <div id="result"></div>
  <div id="status">Loading names...</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPjw95HouwwcwBeJc4J_ZZA0Pqcm9DqcYasKwIbvP2TNS7n-t4dDZQHze-st_Z5nUl/exec";

    let allPeople = [];
    let isProcessing = false;

    function jsonpRequest(url, onSuccess, onError) {
      const callbackName = "jsonpCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      const script = document.createElement("script");
      const cleanup = function () {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      window[callbackName] = function (data) { cleanup(); onSuccess(data); };
      script.onerror = function () { cleanup(); onError(new Error("Could not reach the server.")); };
      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + callbackName;
      document.body.appendChild(script);
    }

    function renderList(people) {
      const listDiv = document.getElementById("list");
      listDiv.innerHTML = "";
      if (people.length === 0) {
        listDiv.innerHTML = "<div style='color:#64748b;text-align:center;padding:20px;'>No matches</div>";
        return;
      }
      people.forEach(function (p) {
        const btn = document.createElement("button");
        btn.className = "person-btn";
        btn.innerHTML = p.name + (p.purpose ? '<span class="purpose">' + p.purpose + "</span>" : "");
        btn.onclick = function () { handleTap(p); };
        listDiv.appendChild(btn);
      });
    }

    function handleTap(person) {
      if (isProcessing) return;
      isProcessing = true;

      const resultDiv = document.getElementById("result");
      resultDiv.className = "show";
      resultDiv.textContent = "Recording for " + person.name + "...";

      jsonpRequest(
        WEB_APP_URL + "?id=" + encodeURIComponent(person.id),
        function (data) {
          resultDiv.className = "show " + (data.status === "in" ? "in" : (data.status === "out" ? "out" : "error"));
          resultDiv.textContent = data.message;
          setTimeout(function () {
            resultDiv.className = "";
            isProcessing = false;
          }, 3500);
        },
        function (err) {
          resultDiv.className = "show error";
          resultDiv.textContent = "Error: " + err.message;
          setTimeout(function () {
            resultDiv.className = "";
            isProcessing = false;
          }, 3500);
        }
      );
    }

    document.getElementById("search").addEventListener("input", function (e) {
      const q = e.target.value.trim().toLowerCase();
      const filtered = q === "" ? allPeople : allPeople.filter(function (p) {
        return p.name.toLowerCase().indexOf(q) !== -1;
      });
      renderList(filtered);
    });

    if (WEB_APP_URL.indexOf("PASTE_YOUR") === 0) {
      document.getElementById("status").textContent = "⚠️ Set WEB_APP_URL in the code before using this page.";
    } else {
      jsonpRequest(
        WEB_APP_URL + "?action=list",
        function (data) {
          allPeople = data;
          renderList(allPeople);
          document.getElementById("status").textContent = allPeople.length + " people loaded";
        },
        function (err) {
          document.getElementById("status").textContent = "Failed to load names: " + err.message;
        }
      );
    }
  </script>
</body>
</html>
